name: GHA action testing

on:
  workflow_dispatch:     # Manual trigger
  push:                  # Push trigger
    branches:
      - '**'

permissions:
  id-token: write
  contents: read 
  
jobs:
  register-build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Register Build Artifact
        id: artifact
        uses: cloudbees-io-gha/register-build-artifact@v3
        with:
          name: "artifact-demo"
          version: 1.0.0
          url: "ghcr.io/haakaashbee/testaction/prod-artifact:latest"
          digest: "sha256:566b1117a16243a43be01e378a20ee823c95d00cd5f3231ad4d168f53d99d9d8"
          type: "docker"
          label: 'QA,production'
          workflow-name: gha-action-testing

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Register Build Artifact
        uses: cloudbees-io-gha/register-build-artifact@v3
        with:
          name: "demo-go-service"
          version: 1.0
          url: "020229604682.dkr.ecr.us-east-1.amazonaws.com/throwaway/actions/vulnerable-image:tagGha"
          cloudbees-url: "https://api.saas-preprod.beescloud.com"   
